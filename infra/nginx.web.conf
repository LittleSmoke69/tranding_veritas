server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Mesmas rotas que o proxy do Vite usa em dev (vite.config.ts) — aqui
  # encaminhadas para o container da API dentro da rede do compose.
  location ~ ^/(auth|trades|market|robots|api|health)(/|$) {
    proxy_pass http://api:4010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
